site_name: EcoTrace
site_description: High-precision carbon tracking engine for production Python.
site_author: Emre Ozkal
repo_url: https://github.com/Zwony/ecotrace
repo_name: Zwony/ecotrace

theme:
  name: material
  logo: images/logo.png
  favicon: images/logo.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode



nav:
  - Home: index.md
  - Usage: USAGE.md
  - Architecture: ARCHITECTURE.md
  - Support: SUPPORT.md
