site_name: EcoTrace
site_url: https://ecotrace.readthedocs.io/en/latest/
site_description: High-precision carbon tracking engine for production Python.
site_author: Emre Ozkal

repo_url: https://github.com/Zwony/ecotrace
repo_name: Zwony/ecotrace

theme:
  name: material
  logo: images/logo.png
  favicon: images/logo.png
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          setup_commands:
            - import sys
            - sys.path.append(".")

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Zwony/ecotrace
    - icon: fontawesome/brands/discord
      link: https://discord.gg/hs58XXb3Uq
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/ecotrace

nav:
  - Home: index.md
  - Usage: USAGE.md
  - API Reference: api.md
  - Architecture: ARCHITECTURE.md
  - Academic Benchmarks:
      - Technical Whitepaper: WHITE_PAPER.md
      - Overview: benchmarks/index.md
      - Accuracy vs. RAPL Counters: benchmarks/07_accuracy_validation.md
      - Pandas vs. Polars (Data Engineering): benchmarks/01_pandas_vs_polars.md
      - PyTorch vs. TensorFlow (ML Training): benchmarks/02_ml_training_frameworks.md
      - Algorithmic Complexity (Sorting): benchmarks/03_sorting_algorithms.md
      - Web Frameworks (Flask vs FastAPI): benchmarks/04_web_frameworks.md
      - LLM Inference Scaling: benchmarks/05_llm_inference.md
      - Regional Grid Arbitrage (15 Countries): benchmarks/06_regional_carbon.md
  - Integrations:
      - Flask: USAGE.md
      - FastAPI: USAGE.md
  - Community:
      - Contributing: CONTRIBUTING.MD
      - Code of Conduct: CODE_OF_CONDUCT.MD
      - Security: SECURITY.MD
      - Support: SUPPORT.md
  - History:
      - Changelog: CHANGELOG.md
      - v1.5.1: history/releases/RELEASE_v1.5.1.md
      - v1.5.0: history/releases/RELEASE_v1.5.0.md
      - v1.4.3: history/releases/RELEASE_v1.4.3.md
      - v1.4.2: history/releases/RELEASE_v1.4.2.md
      - v1.4.1: history/releases/RELEASE_v1.4.1.md
      - v1.4.0: history/releases/RELEASE_v1.4.0.md
      - v1.3.0: history/releases/RELEASE_v1.3.0.md
      - v1.2.1: history/releases/RELEASE_v1.2.1.md
      - v1.2.0: history/releases/RELEASE_v1.2.0.md
      - v1.1.2: history/releases/RELEASE_v1.1.2.md
      - v1.1.0: history/releases/RELEASE_v1.1.0.md
      - v1.0.1: history/releases/RELEASE_v1.0.1.md
      - v0.9.0: history/releases/RELEASE_v0.9.0.md
      - v0.8.0: history/releases/RELEASE_v0.8.0.md
      - v0.7.1: history/releases/RELEASE_v0.7.1.md
      - v0.7.0: history/releases/RELEASE_v0.7.0.md
      - v0.6.1: history/releases/RELEASE_v0.6.1.md
      - v0.6.0: history/releases/RELEASE_v0.6.0.md
      - v0.5.2: history/releases/RELEASE_v0.5.2.md
      - v0.5.1: history/releases/RELEASE_v0.5.1.md
      - v0.5.0: history/releases/RELEASE_v0.5.0.md
      - v0.4.0: history/releases/RELEASE_v0.4.0.md

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html