site_name: EcoTrace
site_description: High-precision carbon tracking engine for production Python.
site_author: Emre Ozkal
repo_url: https://github.com/Zwony/ecotrace
repo_name: Zwony/ecotrace

theme:
  name: material
  logo: images/logo.png
  favicon: images/logo.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode


plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          setup_commands:
            - import sys
            - sys.path.append(".")

nav:
  - Home: index.md
  - Usage: USAGE.md
  - API Reference: api.md
  - Architecture: ARCHITECTURE.md
  - Community:
      - Contributing: CONTRIBUTING.md
      - Code of Conduct: CODE_OF_CONDUCT.md
      - Security: SECURITY.md
  - History: CHANGELOG.md
  - Support: SUPPORT.md
